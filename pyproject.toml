[project]
name = "medallion-pipeline"
version = "0.1.0"
description = "Databricks medallion pipeline learning project"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
formatting = [
    "ruff>=0.12.0",
]
linting = [
    "ruff>=0.12.0",
]
type-checking = [
    "mypy>=1.17.0",
]
testing = [
    "chispa>=0.10.1",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "pytest-mock>=3.14.0",
    "pyspark>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "--cov=src", "--cov-report=term-missing"]
markers = [
    "unit: fast local unit tests",
    "contract: schema and data-quality contract tests",
    "integration: tests requiring a Databricks workspace",
    "e2e: deployed end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
ignore_missing_imports = true
disallow_untyped_defs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medallion_pipeline"]
