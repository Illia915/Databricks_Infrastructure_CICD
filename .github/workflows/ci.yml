name: CI

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  formatting:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install formatting dependencies
        run: uv sync --locked --only-group formatting --no-install-project

      - name: Check formatting
        run: uv run --no-sync ruff format --check src tests

  linting:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install linting dependencies
        run: uv sync --locked --only-group linting --no-install-project

      - name: Lint
        run: uv run --no-sync ruff check src tests

  type-checking:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install type-checking dependencies
        run: uv sync --locked --only-group type-checking --no-install-project

      - name: Type check
        run: uv run --no-sync mypy

  tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java for PySpark
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install testing dependencies
        run: uv sync --locked --only-group testing

      - name: Install project package
        run: uv pip install --editable .

      - name: Run tests
        run: uv run --no-sync pytest
